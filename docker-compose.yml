name: xp-whatsapp

services:
  database:
    image: postgres:18-alpine
    container_name: xp-whatsapp-database
    restart: unless-stopped
    stop_grace_period: 1m
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-xp_atendimento}
      POSTGRES_USER: ${POSTGRES_USER:-xp_whatsapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    volumes:
      - xp_whatsapp_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - xp_whatsapp_internal

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: xp-whatsapp-app
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Defina DATABASE_URL no arquivo .env}
      AUTH_SECRET: ${AUTH_SECRET:?Defina AUTH_SECRET no arquivo .env}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-XP Atendimento}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://whatsapp.xpeletronicos.com}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-demo}
      META_GRAPH_API_VERSION: ${META_GRAPH_API_VERSION:-v23.0}
      META_HTTP_TIMEOUT_MS: ${META_HTTP_TIMEOUT_MS:-15000}
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_BUSINESS_ACCOUNT_ID: ${WHATSAPP_BUSINESS_ACCOUNT_ID:-}
      WHATSAPP_CATALOG_ID: ${WHATSAPP_CATALOG_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      MEDIA_ROOT: /data/media
    ports:
      - "127.0.0.1:${APP_PORT:-3100}:3000"
    volumes:
      - xp_whatsapp_media:/data/media
    depends_on:
      database:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - xp_whatsapp_internal
      - xp_whatsapp_egress

networks:
  xp_whatsapp_internal:
    name: xp_whatsapp_internal
    internal: true
  xp_whatsapp_egress:
    name: xp_whatsapp_egress

volumes:
  xp_whatsapp_postgres:
    name: xp_whatsapp_postgres
  xp_whatsapp_media:
    name: xp_whatsapp_media
